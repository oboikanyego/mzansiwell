services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["wholesome_mongo:/data/db"]
  api:
    build: ./backend
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/wholesome_path
      CLIENT_ORIGIN: http://localhost:4200
    ports: ["3000:3000"]
    depends_on: [mongo]
  web:
    build: ./frontend
    ports: ["4200:80"]
    depends_on: [api]
volumes:
  wholesome_mongo:

